name: Bug report
description: Report a bug or regression in Recipe Fallback
title: "[Bug]: "
labels:
  - bug
assignees:
  - NineOfGaming
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        Please include enough detail to reproduce the issue. Recipe Fallback is client-side only, so reports should focus on what the client shows or how it behaves.
  - type: input
    id: mod_version
    attributes:
      label: Recipe Fallback version
      description: Which version of the mod are you using?
      placeholder: 0.0.0
    validations:
      required: true
  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft version
      description: Which Minecraft version are you running?
      placeholder: 1.21.11
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does this happen?
      description: Choose the environment where you can reproduce the issue.
      options:
        - Multiplayer server
        - Singleplayer
        - LAN world
        - Realms
    validations:
      required: true
  - type: input
    id: server_or_pack
    attributes:
      label: Server or modpack
      description: If relevant, name the server, pack, or setup where this happens.
      placeholder: Vanilla server, custom modpack, local instance, etc.
  - type: checkboxes
    id: optional_components
    attributes:
      label: Installed optional components
      description: Select anything relevant to this report.
      options:
        - label: Mod Menu
        - label: Roughly Enough Items (REI)
        - label: Architectury-based mods
        - label: Client-only resource packs or recipe-adding mods
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is going wrong?
      placeholder: The client recipe book stays empty after joining a server that does not sync recipe data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to trigger the issue.
      placeholder: |
        1. Launch the game with Recipe Fallback installed
        2. Join ...
        3. Open ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected_result
    attributes:
      label: Expected result
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: actual_result
    attributes:
      label: Actual result
      description: What happened instead?
    validations:
      required: true
  - type: upload
    id: crash
    attributes:
      label: Upload crash report
      description: If applicable, add crash report(s) to help explain your problem.
    validations:
      required: false
  - type: upload
    id: logs
    attributes:
      label: Upload logs
      description: If applicable, add log(s) to help explain your problem.
    validations:
      required: false
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked for existing issues about the same problem.
          required: true
        - label: I tested on the latest available version of Recipe Fallback.
          required: true
        - label: I understand this mod only affects client-side recipe visibility and does not change server-side crafting behavior.
          required: true
