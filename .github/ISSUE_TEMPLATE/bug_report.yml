name: Bug report
description: Report a bug or regression in Recipe QoL
title: "bug: "
labels:
  - bug
assignees:
  - NineOfGaming
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible bugs or regressions in Recipe QoL.

        Recipe QoL is client-side only, so reports should focus on client behavior, recipe visibility, UI, or compatibility.
  - type: input
    id: mod_version
    attributes:
      label: Recipe QoL version
      placeholder: 0.0.0
    validations:
      required: true
  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft version
      placeholder: 1.21.x
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Relevant setup
      description: Include the server or pack, and any relevant mods like REI, JEI, or Mod Menu.
      placeholder: Singleplayer, a specific server, a modpack, or any compatibility details that matter.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch the game with Recipe QoL installed
        2. Join ...
        3. Open ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      placeholder: Joining the server clears the recipe book and fallback does not rebuild it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, crash reports, or screenshots
      description: Paste anything useful here. You can also attach files after opening the issue.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing issue first.
          required: true
        - label: I can still reproduce this on the latest available version.
          required: true
        - label: I understand this mod only changes client-side behavior and does not bypass server-side crafting logic.
          required: true
