name: Feature request
description: Suggest an improvement for Recipe QoL
title: "feature: "
labels:
  - enhancement
assignees:
  - NineOfGaming
body:
  - type: markdown
    attributes:
      value: |
        Use this form for feature ideas, UX improvements, and compatibility requests for Recipe QoL.

        Recipe QoL is client-side only, so requests should stay focused on client behavior, recipe visibility, UI, compatibility, or configuration.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: When connecting to certain servers, I need a way to...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What change would you like?
      placeholder: Add an option that...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Add examples, mockups, server or pack context, or anything else that would help.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing issue or request first.
          required: true
        - label: I understand this request should stay within client-side behavior, UI, compatibility, or configuration.
          required: true
